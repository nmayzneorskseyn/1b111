[2,3,4],"explanation":"Судың белсенділігі тұрақтыға енгізіледі; Ka өнімдер белсенділіктерінің реагентке қатынасын береді."},{"question":"Буфер ерітіндісіндегі қышқыл мен қосарланған негіздің қатынасына сәйкес тұжырымдарды таңдаңыз.","options":["[A⁻]>[HA] болса, pH > pKa болады.","[A⁻]<[HA] болса, pH < pKa болады.","[A⁻]<[HA] болса, pH > pKa болады.","[A⁻]=[HA] болса, pH ≈ 2pKa болады.","[A⁻]=[HA] болса, pH ≈ pKa болады.","[A⁻]>[HA] болса, pH < pKa болады."],"correct":[0,1,4],"explanation":"Хендерсон-Хассельбалх теңдеуі: pH = pKa + log([A⁻]/[HA])."},{"question":"pKa=4,8 болатын HA/A⁻ буферінде [A⁻]/[HA]=10 болса, дұрыс қорытындыларды анықтаңыз.","options":["Ерітіндіде қышқылдың концентрациясы басым.","Ерітіндіде қосарланған негіздің концентрациясы басым.","Буфердің pH мәні шамамен 3,8 болады.","pH−pKa айырмасы шамамен −1-ге тең.","pH−pKa айырмасы шамамен 1-ге тең.","Буфердің pH мәні шамамен 5,8 болады."],"correct":[1,4,5],"explanation":"pH = 4,8 + log10 = 5,8."},{"question":"Қышқыл-негіз тепе-теңдігіндегі тепе-теңдік тұрақтысын бағалауға қатысты дұрыс тұжырымдарды таңдаңыз.","options":["K≈1 болса, екі жақтың да елеулі мөлшерде болуы мүмкін.","K≪1 болса, тепе-теңдік реагенттер жағына ығысқан.","K≪1 болса, тепе-теңдік өнімдер жағына ығысқан.","K≈1 болса, реакция міндетті түрде толық аяқталады.","K≫1 болса, тепе-теңдік реагенттер жағына ығысқан.","K≫1 болса, тепе-теңдік өнімдер жағына ығысқан."],"correct":[0,1,5],"explanation":"K тепе-теңдік құрамын көрсетеді; K≈1 кезінде екі жақ та маңызды."},{"question":"Қышқыл мен негіз әрекеттескенде протон берілуінің бағытын бағалауға қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Қышқылдардың молярлық массасын салыстыру бағытты толық анықтайды.","Қосарланған негіздің тұрақтылығы тепе-теңдікке әсер етпейді.","Өнімдегі қышқыл күштірек болса, өнім түзілуі әрдайым қолайлы.","Қышқылдардың pKa мәндерін салыстыру бағытты болжауға көмектеседі.","Өнімдегі қышқыл әлсіздеу болса, өнім түзілуі термодинамикалық қолайлы.","Қосарланған негізд  article.append(el('div','qnum',`${j+1}-сұрақ`),el('h3','',q.question));
 q.options.forEach((option,k)=>{const chosen=st.answers[j].includes(k);const label=el('label','opt');if(revealed){if(q.correct.includes(k))label.classList.add('correct');else if(chosen)label.classList.add('incorrect');if(chosen)label.classList.add('selected')}
 const input=document.createElement('input');input.type='checkbox';input.checked=chosen;input.disabled=revealed;input.addEventListener('change',()=>{if(input.checked){if(st.answers[j].length>=3){input.checked=false;alert('Ең көбі үш жауап таңдауға болады.');return}st.answers[j].push(k)}else st.answers[j]=st.answers[j].filter(x=>x!==k)});label.append(input,el('span','',`${LETTERS[k]}) ${option}`));article.append(label)});
 if(st.mode==='quiz'&&!st.finished&&!revealed){const check=el('button','', 'Жауапты тексеру');check.addEventListener('click',()=>{if(!st.answers[j].length){alert('Алдымен жауапты таңдаңыз.');return}st.revealed.add(j);refreshChapter(c)});article.append(check)}
 if(revealed){const box=el('div','explanation');const chosen=st.answers[j];const ok=equal(chosen,q.correct);box.append(el('strong','',ok?'Дұрыс жауап':'Жауапты талдау'));box.append(el('p','',`Сіздің таңдауыңыз: ${chosen.length?chosen.map(x=>LETTERS[x]).join(', '):'Жауап таңдалмаған'}`));box.append(el('p','',`Дұрыс жауаптар: ${q.correct.map(x=>LETTERS[x]).join(', ')}`));box.append(el('p','',q.explanation));article.append(box)}return article}
function refreshChapter(c){const ch=CHAPTERS[c],st=states[c],sec=document.getElementById(`chapter-${c+1}`);const old=sec.querySelector('.chapter-body');const body=el('div','chapter-body');
 const bar=el('div','toolbar');['quiz','test'].forEach(m=>{const b=el('button',st.mode===m?'active':'',m==='quiz'?'Quiz':'Test');b.disabled=st.finished;b.addEventListener('click',()=>{if(st.mode===m)return;const hasAnswers=st.answers.some(a=>a.length)||st.revealed.size>0;if(hasAnswers&&!confirm('Режим ауысқанда осы тараудағы жауаптар өшіріледі. Жалғастырасыз ба?'))return;st.mode=m;st.answers=Array.from({length:ch.end-ch.start},()=>[]);st.revealed=new Set();st.finished=false;refreshChapter(c)});bar.append(b)});body.append(bar);
 body.append(el('p','hint',st.mode==='quiz'?'Жауаптарды таңдаңыз, әр сұрақты жеке тексеріңіз немесе тараудың соңында жалпы нәтижені ашыңыз.':'Жауаптарды таңдаңыз. Дұрыс жауаптар мен түсіндірмелер тараудың соңындағы нәтижені ашқанда көрсетіледі.'));
 for(let j=0;j<ch.end-ch.start;j++)body.append(showQuestion(c,j));
 if(!st.finished){const finish=el('button','chapter-finish','Тарау нәтижесін көрсету');finish.addEventListener('click',()=>{st.finished=true;refreshChapter(c);const score=document.getElementById(`score-${c+1}`);score.scrollIntoView({behavior:'smooth',block:'center'})});body.append(finish)}
 else{const sc=scoreChapter(c);const box=el('div','score');box.id=`score-${c+1}`;box.append(el('strong','',`Тарау нәтижесі: ${sc.points} / ${sc.total*2} ұпай`));box.append(el('p','',`Толық дұрыс жауаптар: ${sc.exact} / ${sc.total}. Жауап берілген сұрақтар: ${sc.answered} / ${sc.total}.`));box.append(el('p','',`Әр сұрақтың астында сіз таңдаған нұсқалар, дұрыс жауаптар және түсіндірме көрсетілді.`));body.insertBefore(box,body.children[2]);const reset=el('button','chapter-finish','Тарауды қайта бастау');reset.addEventListener('click',()=>{st.answers=Array.from({length:ch.end-ch.start},()=>[]);st.revealed=new Set();st.finished=false;refreshChapter(c)});body.append(reset)}old.replaceWith(body)}
CHAPTERS.forEach((ch,c)=>{const link=el('a','chapter-link');link.href=`#chapter-${c+1}`;link.append(el('strong','',`${c+1}-тарау`),el('span','',ch.title),el('small','',`${ch.end-ch.start} сұрақ`));nav.append(link);
 const section=el('section','chapter');section.id=`chapter-${c+1}`;const heading=el('div','chapter-head');heading.append(el('h2','',`${c+1}-тарау. ${ch.title}`),el('span','muted',`${ch.end-ch.start} сұрақ`));section.append(heading,el('div','chapter-body'));root.append(section);refreshChapter(c)});
</script></body></html>
